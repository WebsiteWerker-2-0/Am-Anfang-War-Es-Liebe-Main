name: Branch „deploy“ für Hostinger aktualisieren

# Hostinger erwartet die Next.js-App (package.json) im Hauptordner des Repositories.
# Sie liegt hier aber in website/. Diese Aktion veröffentlicht den Inhalt von website/
# als eigenen Branch „deploy“, den Hostinger beim Import des Repositories wählt.
# Der Branch wird bei jeder Änderung an website/ auf main neu erzeugt und nie von Hand bearbeitet.

on:
  push:
    branches: [main]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inhalt von website/ als Branch „deploy“ veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=website -b deploy-split
          git push --force origin deploy-split:deploy
